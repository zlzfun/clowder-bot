<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>猫猫头像样页 · clowder-bot</title>
  <link rel="stylesheet" href="./lab-v1.css">
</head>
<body>
  <main>
    <header class="masthead">
      <a class="brand" href="#">clowder-bot <span> / 猫猫头像研究所</span></a>
      <span class="edition">AVATAR STUDIES — 2026.10</span>
    </header>
    <section class="intro">
      <div><p class="eyebrow">EIGHT COMPANIONS, NINE EXPRESSIONS</p><h1>给每位伙伴，一张猫猫脸。</h1><p class="intro-note">9 组风格 · 8 位伙伴 · 72 款头像。沿用 demo 的角色设定，在同一张样页里比较。</p></div>
      <div class="intro-mark" aria-hidden="true">=＾･ω･＾=</div>
    </section>
    <section class="tryout" aria-labelledby="tryout-title">
      <div class="section-top"><div><h2 id="tryout-title">放进聊天里看看</h2><span class="muted" id="selected-label" aria-live="polite">A · 奶油扁平</span></div><label class="select-label">预览风格 <select id="style-select" aria-label="聊天预览风格"></select></label></div>
      <div class="preview-pair" id="previews"></div>
    </section>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-toolbar"><div><h2 id="catalog-title">全部风格，一眼比较</h2><p>点击任意头像，查看大图、真实尺寸与对应素材。</p></div><div class="controls"><div class="segmented" aria-label="头像裁切"><button data-shape="round" aria-pressed="true">圆形</button><button data-shape="square" aria-pressed="false">方形</button></div><button id="theme-toggle" class="outline" aria-pressed="false">深色背景</button></div></div>
      <div class="column-head" id="column-head"></div>
      <div id="style-rows"></div>
    </section>
    <footer><div><strong>同一群猫，各有表达。</strong><p>SVG 可直接使用；生图保留整组原图，并可在详情中导出单只 PNG。样页中的选择只用于预览。</p></div><div class="footer-links"><a href="./avatar-collection.zip" download>下载整套素材 ↗</a><a href="./overview-v1.png" download>保存完整样页 ↗</a></div></footer>
  </main>
  <dialog id="detail"><button class="close" aria-label="关闭详情">×</button><div id="detail-content"></div></dialog>
  <script src="./lab-v1.js" defer></script>
</body>
</html>
